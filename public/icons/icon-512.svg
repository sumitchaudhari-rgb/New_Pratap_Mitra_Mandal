<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B1A2C"/>
      <stop offset="50%" stop-color="#5B0E1B"/>
      <stop offset="100%" stop-color="#2D060C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A7"/>
      <stop offset="35%" stop-color="#F5B800"/>
      <stop offset="70%" stop-color="#D49000"/>
      <stop offset="100%" stop-color="#8C5E00"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#F5B800" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#8B1A2C" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Decorative Border -->
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="14 7" opacity="0.65"/>
  <rect x="28" y="28" width="456" height="456" rx="84" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.4"/>

  <!-- Sun Glow -->
  <circle cx="256" cy="230" r="160" fill="url(#sunGlow)"/>

  <!-- Sacred Rays -->
  <g stroke="url(#goldGrad)" stroke-width="2" opacity="0.3" stroke-linecap="round">
    <line x1="256" y1="80" x2="256" y2="110"/>
    <line x1="256" y1="350" x2="256" y2="380"/>
    <line x1="120" y1="230" x2="150" y2="230"/>
    <line x1="362" y1="230" x2="392" y2="230"/>
    <line x1="160" y1="134" x2="182" y2="156"/>
    <line x1="330" y1="304" x2="352" y2="326"/>
    <line x1="160" y1="326" x2="182" y2="304"/>
    <line x1="330" y1="156" x2="352" y2="134"/>
  </g>

  <!-- Divine Trishul Motif -->
  <g filter="url(#shadow)" fill="url(#goldGrad)">
    <!-- Central Spear -->
    <path d="M256,120 L266,170 L261,290 L251,290 L246,170 Z" />
    <!-- Left Prong -->
    <path d="M256,220 C220,215 195,185 190,145 C198,175 220,195 246,198 L248,225 Z" />
    <!-- Right Prong -->
    <path d="M256,220 C292,215 317,185 322,145 C314,175 292,195 266,198 L264,225 Z" />
    <!-- Trishul Base Ring -->
    <rect x="242" y="290" width="28" height="10" rx="3" />
    <!-- Damru Shape -->
    <polygon points="244,303 268,303 256,316" />
    <polygon points="256,316 268,329 244,329" />
    <rect x="251" y="329" width="10" height="40" rx="2" />
  </g>

  <!-- Sacred Devanagari Om & Text -->
  <text x="256" y="200" text-anchor="middle" fill="#FFFFFF" font-family="'Tiro Devanagari Marathi', serif" font-weight="bold" font-size="64" opacity="0.95" filter="url(#shadow)">ॐ</text>

  <!-- Text: न्यु प्रताप मित्र मंडळ -->
  <text x="256" y="415" text-anchor="middle" fill="url(#goldGrad)" font-family="'Mukta', sans-serif" font-weight="800" font-size="34" letter-spacing="1" filter="url(#shadow)">न्यु प्रताप</text>
  <text x="256" y="450" text-anchor="middle" fill="#FFDFC0" font-family="'Mukta', sans-serif" font-weight="600" font-size="20" letter-spacing="2">डांगरवाडा असोदा • २०२६</text>
</svg>
